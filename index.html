<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Currency Ruler</title>
  <meta name="description" content="Read prices across two currencies on a logarithmic ruler.">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong colours.
    // src/main.js takes over from here; this only mirrors resolveTheme() in src/themes.js.
    (function () {
      var theme = 'system'
      try { theme = JSON.parse(localStorage.getItem('currency-ruler:prefs') || '{}').theme || theme } catch (e) {}
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
    })()
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8.75' y='1.75' width='14.5' height='28.5' rx='3' fill='%23faede7' stroke='%23d2643f' stroke-width='1.5'/%3E%3Cpath d='M9 7h8M9 12h5M9 16h8M9 20h5M9 25h8' stroke='%23d2643f' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ruler">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&display=swap">
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <main class="app">
    <h1 class="sr-only">Currency ruler</h1>
    <!-- The screen is the slide rule. Everything else is a small tool laid over it. -->
    <div class="ruler" id="ruler" tabindex="0" aria-roledescription="ruler" aria-label="Conversion ruler. Drag to slide the scale under the reading line, pinch to zoom, double-tap to reset. Arrow keys step the reading, plus and minus zoom, 0 resets.">
      <canvas id="canvas" aria-hidden="true"></canvas>
      <div class="glass" id="glass">
        <span class="band" aria-hidden="true"></span>
        <span class="hair" aria-hidden="true"></span>
        <input class="pill pill-a" id="amt-a" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done">
        <input class="pill pill-b" id="amt-b" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done">
      </div>
    </div>

    <div class="tools tools-top">
      <button type="button" class="tag" id="pick-a" aria-haspopup="dialog"><span id="name-a">Yen</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tag tag-round swap" id="swap" aria-label="Swap sides" title="Swap sides"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6h12m0 0-3-3m3 3-3 3M15.5 12h-12m0 0 3-3m-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tag" id="pick-b" aria-haspopup="dialog"><span id="name-b">Dollars</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <div class="tools tools-bottom">
      <button type="button" class="tag status" id="status" data-tone="muted" aria-haspopup="dialog">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Checking today’s rate</span>
      </button>
      <a class="tag credit" id="credit" href="https://www.exchangerate-api.com" target="_blank" rel="noopener" hidden>Rates By Exchange Rate API</a>
      <button type="button" class="tag tag-round" id="open-settings" aria-label="Settings" aria-haspopup="dialog" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>

    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="toast" id="update-toast" role="status" hidden>
      <span>A new version is ready.</span>
      <button type="button" class="link-btn" id="update-reload">Reload</button>
    </div>
  </main>

  <dialog class="sheet picker" id="picker" aria-labelledby="picker-title">
    <div class="picker-body">
      <header class="sheet-head">
        <h2 id="picker-title">Left-hand currency</h2>
        <form method="dialog">
          <button class="icon-btn" value="close" aria-label="Close currency list">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 4.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </form>
      </header>
      <label class="picker-search">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="picker-q" placeholder="Country, currency or code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search currencies" aria-controls="picker-list">
      </label>
      <div class="picker-list" id="picker-list"></div>
    </div>
  </dialog>

  <dialog class="sheet" id="rate-sheet" aria-labelledby="rate-title">
    <form method="dialog">
      <header class="sheet-head">
        <h2 id="rate-title">Exchange rate</h2>
        <button class="icon-btn" value="close" aria-label="Close rate details">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 4.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet-body">
        <p class="rate-big" id="rate-big"></p>
        <p class="rate-line" id="rate-source"></p>
        <p class="rate-line" id="rate-credit" hidden><a class="link-btn" href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a></p>
        <p class="rate-line rate-checked" id="rate-checked" data-tone="muted"></p>
        <p class="rate-note">Cards and exchange counters add their own margin, so what you pay can differ by a few percent.</p>
        <button type="button" class="tool wide" id="rate-check">Check again</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <header class="sheet-head">
        <h2 id="settings-title">Settings</h2>
        <button class="icon-btn" value="close" aria-label="Close settings">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 4.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <ul class="settings">
        <li>
          <label class="setting">
            <span class="setting-text">
              <span class="setting-name">Scales meet in the middle</span>
              <span class="setting-desc">Ticks grow out from a line down the centre, with the amounts on the outside.</span>
            </span>
            <input type="checkbox" role="switch" class="switch" id="opt-middle">
          </label>
        </li>
        <li>
          <fieldset class="setting setting-themes">
            <legend class="setting-name">Theme</legend>
            <div class="themes" id="theme-options"></div>
          </fieldset>
        </li>
        <li id="install-item" hidden>
          <div class="setting">
            <span class="setting-text">
              <span class="setting-name">Install app</span>
              <span class="setting-desc" id="install-desc"></span>
            </span>
            <button type="button" class="tool" id="install-btn" hidden>Install</button>
          </div>
        </li>
      </ul>
      <p class="about" id="about"></p>
    </form>
  </dialog>
</body>
</html>
